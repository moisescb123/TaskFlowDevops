name: CD

# Deploy only after the CI workflow succeeds on main (RN03 / US15).
# Failing CI runs never reach this job (workflow_run conclusion gate).
# Manual workflow triggers are omitted so redeploy cannot skip green CI.

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    steps:
      - name: Checkout release revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Trigger Render deploy hook
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK" ]; then
            echo "::error::Repository secret RENDER_DEPLOY_HOOK is not set."
            echo "Create a Render web service from render.yaml, then add its Deploy Hook URL as a GitHub Actions secret."
            exit 1
          fi
          curl -fsS -X POST "$RENDER_DEPLOY_HOOK"
          echo "Deploy hook accepted."
