openapi: 3.0.0
info:
  title: TaskFlow DevOps API
  description: |
    REST API for TaskFlow DevOps — academic web task board with role-based access
    and DevOps-oriented delivery practices.
  version: 0.1.0
  contact:
    name: TaskFlow DevOps Team

servers:
  - url: http://localhost:5000
    description: Local Flask development server

tags:
  - name: Auth
  - name: Users
  - name: Tasks

paths:
  /api/auth/login:
    post:
      tags: [Auth]
      summary: Log in
      description: Authenticate with email and password; establish a session (US01).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: Invalid credentials

  /api/auth/logout:
    post:
      tags: [Auth]
      summary: Log out
      description: End the current session (US02).
      responses:
        '204':
          description: Logged out
        '401':
          description: Not authenticated

  /api/auth/me:
    get:
      tags: [Auth]
      summary: Current user
      responses:
        '200':
          description: Current authenticated user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: Not authenticated

  /api/users:
    get:
      tags: [Users]
      summary: List users
      description: Admin lists users; Developers may need a reduced list for assignee selection.
      responses:
        '200':
          description: User list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
        '401':
          description: Not authenticated
        '403':
          description: Forbidden
    post:
      tags: [Users]
      summary: Register user
      description: Admin creates a user and assigns a role (US03).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreate'
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Validation error (missing fields, invalid role, or duplicate email)
        '401':
          description: Not authenticated
        '403':
          description: Forbidden (non-Admin)

  /api/tasks:
    get:
      tags: [Tasks]
      summary: List tasks
      description: Board data for authenticated users (US04). Viewers included.
      responses:
        '200':
          description: Task list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Task'
        '401':
          description: Not authenticated
    post:
      tags: [Tasks]
      summary: Create task
      description: Developer creates a task in To Do (US05, RN02). Admin and Viewer forbidden.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskCreate'
      responses:
        '201':
          description: Task created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          description: Validation error (missing/invalid title, priority, due_date, or assignee)
        '401':
          description: Not authenticated
        '403':
          description: Forbidden for Admin or Viewer

  /api/tasks/{taskId}:
    parameters:
      - $ref: '#/components/parameters/TaskId'
    get:
      tags: [Tasks]
      summary: Get task
      responses:
        '200':
          description: Task
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '404':
          description: Not found
    put:
      tags: [Tasks]
      summary: Update task
      description: Developer edits title, priority, due date, and assignee (US06). Status changes use PATCH status (US09).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskUpdate'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          description: Validation error (cleared/invalid required fields)
        '401':
          description: Not authenticated
        '403':
          description: Forbidden for Admin or Viewer
        '404':
          description: Task not found
    delete:
      tags: [Tasks]
      summary: Delete task
      description: Developer deletes a task (US07).
      responses:
        '204':
          description: Deleted
        '403':
          description: Forbidden
        '404':
          description: Not found

  /api/tasks/{taskId}/status:
    parameters:
      - $ref: '#/components/parameters/TaskId'
    patch:
      tags: [Tasks]
      summary: Change task status
      description: Developer moves status with RN04 enforcement (US09).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  $ref: '#/components/schemas/TaskStatus'
      responses:
        '200':
          description: Status updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          description: Illegal transition (e.g. todo to done)
        '403':
          description: Forbidden
        '404':
          description: Not found

components:
  parameters:
    TaskId:
      name: taskId
      in: path
      required: true
      schema:
        type: integer

  schemas:
    Role:
      type: string
      enum: [admin, developer, viewer]

    TaskStatus:
      type: string
      enum: [todo, in_progress, done]

    TaskPriority:
      type: string
      enum: [high, medium, low]

    User:
      type: object
      required: [id, email, full_name, role]
      properties:
        id: { type: integer }
        email: { type: string, format: email }
        full_name: { type: string }
        role: { $ref: '#/components/schemas/Role' }

    UserCreate:
      type: object
      required: [email, password, full_name, role]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password }
        full_name: { type: string }
        role: { $ref: '#/components/schemas/Role' }

    Task:
      type: object
      required: [id, title, status, priority, due_date]
      properties:
        id: { type: integer }
        title: { type: string }
        status: { $ref: '#/components/schemas/TaskStatus' }
        priority: { $ref: '#/components/schemas/TaskPriority' }
        due_date: { type: string, format: date }
        assignee_id: { type: integer, nullable: true }
        assignee_name:
          type: string
          nullable: true
          description: Convenience display name from assignee join (US04 board)
        created_by_id: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    TaskCreate:
      type: object
      required: [title, priority, due_date]
      properties:
        title: { type: string }
        priority: { $ref: '#/components/schemas/TaskPriority' }
        due_date: { type: string, format: date }
        assignee_id: { type: integer, nullable: true }

    TaskUpdate:
      type: object
      properties:
        title: { type: string }
        priority: { $ref: '#/components/schemas/TaskPriority' }
        due_date: { type: string, format: date }
        assignee_id: { type: integer, nullable: true }
